<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Order summary card</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="./images/illustration-hero.svg"
          alt="main hero image"
          class="hero-image"
        />
      </header>
      <main>
        <h1>Order Summary</h1>
        <p>
          You can now listen to mi llions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
        <div class="plan-info">
          <img src="./images/icon-music.svg" alt="music note icon" />
          <div class="plan-name-price">
            <p>Annual Plan</p>
            <p>$59.99/year</p>
          </div>
          <a href="#">change</a>
        </div>
        <button class="proceed">Proceed to Payment</button>
        <button class="cancel">Cancel Order</button>
      </main>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/javierb256"
        >Javier Barrera</a
      >.
    </div>
  </body>
</html>
